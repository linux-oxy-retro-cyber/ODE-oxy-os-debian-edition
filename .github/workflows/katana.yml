name: Katana Auditora de Pacotes do Oxys OS

on:
  workflow_dispatch:

jobs:
  auditar-pacotes:
    runs-on: ubuntu-latest
    container:
      image: debian:stable

    steps:
      - name: Preparar ambiente Debian
        run: |
          apt-get update
          apt-get install -y git wget apt-utils

      - name: Clonar repositório
        run: |
          mkdir -p /teste_packages
          cd /teste_packages
          git clone https://github.com/linux-oxy-retro-cyber/ODE-oxy-os-debian-edition.git .

      - name: Executar auditoria de instalação
        run: |
          LOG_FILE="/tmp/install_log.txt"
          cd /teste_packages/oxys-pack/packges-beta/
          
          echo "=== INÍCIO DA AUDITORIA $(date) ===" > $LOG_FILE
          
          echo -e "\n\n--- 1. Instalando Pacote: oxys-base.deb ---" >> $LOG_FILE
          apt-get install -y ./prioridade/*.deb >> $LOG_FILE 2>&1 || echo "STATUS: FALHA AO INSTALAR OXY-BASE" >> $LOG_FILE
          
          echo -e "\n\n--- 2. Instalando Pacote: oxys-os.deb ---" >> $LOG_FILE
          apt-get install -y ./temas/*.deb >> $LOG_FILE 2>&1 || echo "STATUS: FALHA AO INSTALAR OXYS-OS" >> $LOG_FILE
          
          echo -e "\n\n--- 3. Instalando Pacote: oxy-calamares-settings.deb ---" >> $LOG_FILE
          apt-get install -y ./calamares-temas/oxy*.deb >> $LOG_FILE 2>&1 || echo "STATUS: FALHA AO INSTALAR CALAMARES-SETTINGS" >> $LOG_FILE
          
          echo -e "\n\n--- 4. Tentativa de fix de dependências (apt-get -f install) ---" >> $LOG_FILE
          apt-get install -f -y >> $LOG_FILE 2>&1 || echo "STATUS: FALHA NA TENTATIVA DE FIX" >> $LOG_FILE
          
          echo -e "\n\n=== FIM DA AUDITORIA $(date) ===" >> $LOG_FILE

      - name: Enviar relatório de log
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-instalacao
          path: /tmp/install_log.txt
          retention-days: 1
