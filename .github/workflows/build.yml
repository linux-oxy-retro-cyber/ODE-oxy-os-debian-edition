#=============================================================
#compilador de isos baseado no ecosistema debain
#ele usa container e comandos pacotes como base-config
#e modifica pastas como /etc
#ele contain o binarios do fastfetch e arquivos modificado
#o projeto e disponibilizado em GPLv3
#============================================================
name: Lain Build - Geradora de ISO Oxys OS

on:
  workflow_dispatch: # Botão manual na aba Actions

jobs:                 #inicia tudo 
  build-iso:
    runs-on: ubuntu-latest #inicia o ubuntu como host
    container:
      image: debian:stable #inicia o debian como container pra ser trasnformado

    steps:
      # 1. Configura repositórios do Debian (main, contrib, non-free, non-free-firmware)
      - name: Configurar fontes e repositórios Non-Free
        run: |
          cat <<EOF > /etc/apt/sources.list
          deb http://deb.debian.org/debian stable main contrib non-free non-free-firmware
          deb http://deb.debian.org/debian-security stable-security main contrib non-free non-free-firmware
          deb http://deb.debian.org/debian stable-updates main contrib non-free non-free-firmware
          EOF
          apt-get update
      # 2. Instalar dependências para compilar a ISO e o Kernel Live
      - name: Instalar ferramentas de Build e Kernel
        run: |
          apt-get install -y \
            git wget xz-utils squashfs-tools xorriso \
            grub-pc-bin grub-efi-amd64-bin mtools \
            live-boot live-config linux-image-amd64 initramfs-tools \
            firmware-linux-free firmware-linux-nonfree
      # 3. Clonar o repositório do projeto
      - name: Clonar repositório
        run: |
          mkdir -p /build_root
          cd /build_root
          git clone https://github.com/linux-oxy-retro-cyber/ODE-oxy-os-debian-edition.git .
      # 4. Criar Chroot / Sistema do Oxys OS e aplicar pacotes .deb
      - name: Preparar chroot e instalar pacotes do Oxys OS
        run: |
          cd /build_root/oxys-pack/packges-beta/
          echo "=== Instalando Prioridade (oxys-base.deb) ==="
          apt-get install -y ./prioridade/*.deb || apt-get install -f -y
          echo "=== Instalando Config Calamares (oxy-calamares-settings.deb) ==="
          apt-get install -y ./calamares-temas/*.deb || apt-get install -f -y
          cd /build_root/oxys-pack
          apt-get update && apt-get install -y slim
            # Copiar arquivos de configuração do sistema
            cp /build_root/oxys-pack/sistema/etc/os-release /etc
            cp /build_root/oxys-pack/sistema/etc/os-release /usr/lib
            cp /build_root/oxys-pack/sistema/etc/default/* /etc/default
            cp /build_root/oxys-pack/sistema/etc/slim.conf /etc
            
            # Copiar temas e papéis de parede (-r para pastas)
            mkdir -p /usr/share/backgrounds /usr/share/slim/themes
            cp -r /build_root/oxys-pack/backgrounds/oxys /usr/share/backgrounds/
            cp -r /build_root/oxys-pack/slim/themes/oxys /usr/share/slim/themes/
            
            # Copiar skel e xdg recursivamente (preservando permissões e estrutura)
            cp -r /build_root/oxys-pack/sistema/etc/skel/. /etc/skel/
            cp -r /build_root/oxys-pack/sistema/etc/xdg/. /etc/xdg/

            #garante que a pasta de network exista nessa merda
            mkdir -p /etc/network

            # Define o SLiM como padrão nas configurações do debconf
            echo "slim shared/default-x-display-manager select slim" | debconf-set-selections
            systemctl disable lightdm 2>/dev/null || true
            # Garante que o usuário root existe e remove a senha dele
            passwd -d root
            
            # Garante o link simbólico do sistema de login
            systemctl enable slim.service
            
            # 1. Altera o arquivo /etc/hostname
            # Grava direto no arquivo usando redirecionamento seguro:
            echo "127.0.0.1 localhost oxys-os" > /etc/hosts
            echo "oxys-os" > /etc/hostname
            
            # Copiar o executável do fastfetch e DAR PERMISSÃO DE EXECUÇÃO (chmod)
            cp /build_root/oxys-pack/sistema/usr/bin/fastfetch /usr/bin/
            chmod +x /usr/bin/fastfetch
            
            # Garantir permissões corretas no /etc/skel para novos usuários
            chmod -R 755 /etc/skel
            
            # Garantir os pontos de montagem reais do Linux (VAZIOS)
            mkdir -p /dev /proc /sys /run /mnt /media /tmp
            chmod 1777 /tmp  # /tmp precisa da permissão 1777
            #para o sistema funcionar liso!
         
      # 5. Estruturar o diretório Live da ISO e extrair Kernel/Initrd
      - name: Estruturar diretórios /live e /boot/grub
        run: |
          mkdir -p /iso_work/live
          mkdir -p /iso_work/boot/grub
          # Copia o vmlinuz e initrd mais recentes gerados no sistema para o /live
          cp -f /vmlinuz /iso_work/live/vmlinuz || cp -f /boot/vmlinuz-* /iso_work/live/vmlinuz
          cp -f /initrd.img /iso_work/live/initrd.img || cp -f /boot/initrd.img-* /iso_work/live/initrd.img
          # Compacta a raiz em filesystem.squashfs dentro da pasta /live
          mksquashfs / /iso_work/live/filesystem.squashfs \
            -e /iso_work /build_root /__t /__w /__e /github
      # 6. Injetar GRUB.cfg personalizado
      - name: Configurar GRUB bootloader
        run: |
          cat <<'EOF' > /iso_work/boot/grub/grub.cfg
          set default=0
          set timeout=3
          insmod ext2
          insmod vbe
          insmod gfxterm
          menuentry "Oxys Debian Edition (Live SquashFS)" {
              linux /live/vmlinuz boot=live
              initrd /live/initrd.img
          }
          EOF
      # 7. Compilar a ISO Bootável
      - name: Gerar imagem ISO final
        run: |
          mkdir -p /resultado
          grub-mkrescue -o /resultado/oxys-os-debian-edition.iso /iso_work
      # 8. Enviar ISO para download
      - name: Disponibilizar ISO em Artefatos
        uses: actions/upload-artifact@v4
        with:
          name: oxys-os-debian-edition-iso
          path: /resultado/oxys-os-debian-edition.iso
          retention-days: 1
