name: Lain Build - Geradora de ISO Oxys OS

on:
  workflow_dispatch: # Botão manual na aba Actions

jobs:
  build-iso:
    runs-on: ubuntu-latest
    container:
      image: debian:stable

    steps:
      # 1. Configura repositórios do Debian (main, contrib, non-free, non-free-firmware)
      - name: Configurar fontes e repositórios Non-Free
        run: |
          cat <<EOF > /etc/apt/sources.list
          deb http://deb.debian.org/debian stable main contrib non-free non-free-firmware
          deb http://deb.debian.org/debian-security stable-security main contrib non-free non-free-firmware
          deb http://deb.debian.org/debian stable-updates main contrib non-free non-free-firmware
          EOF
          apt update

      # 2. Instalar dependências para compilar a ISO e o Kernel Live
      - name: Instalar ferramentas de Build e Kernel
        run: |
          apt install -y \
            git wget xz-utils squashfs-tools xorriso \
            grub-pc-bin grub-efi-amd64-bin mtools \
            live-boot live-config linux-image-amd64 initramfs-tools \
            firmware-linux-free firmware-linux-nonfree

      # 3. Clonar o repositório do projeto
      - name: Clonar repositório
        run: |
          mkdir -p /build_root
          cd /build_root
          git clone https://github.com/linux-oxy-retro-cyber/ODE-oxy-os-debian-edition.git .

      # 4. Criar Chroot / Sistema do Oxys OS e aplicar pacotes .deb diretamente com apt install
      - name: Preparar chroot e instalar pacotes do Oxys OS
        run: |
          cd /build_root/oxys-pack/packges-beta/

          echo "=== Instalando pacotes de prioridade e suas dependências ==="
          apt-get install -o Dpkg::Options::="--force-overwrite" -y ./prioridade/*.deb

          echo "=== Instalando pacotes de temas e suas dependências ==="
          apt-get install -o Dpkg::Options::="--force-overwrite" -y ./temas/*.deb

          echo "=== Instalando pacotes do calamares-temas e suas dependências ==="
          apt-get install -o Dpkg::Options::="--force-overwrite" -y ./calamares-temas/*.deb

      # 5. Gerar LOG de todos os pacotes instalados no sistema
      - name: Gerar log de pacotes instalados
        run: |
          mkdir -p /resultado
          echo "==================================================" > /resultado/lista_de_pacotes_instalados.txt
          echo "       LOG DE PACOTES INSTALADOS NO OXYS OS       " >> /resultado/lista_de_pacotes_instalados.txt
          echo "==================================================" >> /resultado/lista_de_pacotes_instalados.txt
          echo "" >> /resultado/lista_de_pacotes_instalados.txt
          
          # Lista todos os pacotes instalados
          dpkg -l >> /resultado/lista_de_pacotes_instalados.txt

      # 6. Estruturar o diretório Live da ISO e extrair Kernel/Initrd
      - name: Estruturar diretórios /live e /boot/grub
        run: |
          mkdir -p /iso_work/live
          mkdir -p /iso_work/boot/grub

          # Copia o vmlinuz e initrd mais recentes gerados no sistema para o /live
          cp -f /vmlinuz /iso_work/live/vmlinuz || cp -f /boot/vmlinuz-* /iso_work/live/vmlinuz
          cp -f /initrd.img /iso_work/live/initrd.img || cp -f /boot/initrd.img-* /iso_work/live/initrd.img

          # Compacta a raiz em filesystem.squashfs dentro da pasta /live
          mksquashfs / /iso_work/live/filesystem.squashfs \
            -e /iso_work /build_root /proc /sys /dev /run /tmp /resultado

      # 7. Injetar GRUB.cfg personalizado
      - name: Configurar GRUB bootloader
        run: |
          cat <<'EOF' > /iso_work/boot/grub/grub.cfg
          set default=0
          set timeout=3

          insmod ext2
          insmod vbe
          insmod gfxterm

          menuentry "Oxys Debian Edition (Live SquashFS)" {
              linux /live/vmlinuz boot=live
              initrd /live/initrd.img
          }
          EOF

      # 8. Compilar a ISO Bootável
      - name: Gerar imagem ISO final
        run: |
          grub-mkrescue -o /resultado/oxys-os-debian-edition.iso /iso_work

      # 9. Enviar ISO e o LOG para download
      - name: Disponibilizar ISO e Log em Artefatos
        uses: actions/upload-artifact@v4
        with:
          name: oxys-os-build-resultado
          path: |
            /resultado/oxys-os-debian-edition.iso
            /resultado/lista_de_pacotes_instalados.txt
          retention-days: 1
