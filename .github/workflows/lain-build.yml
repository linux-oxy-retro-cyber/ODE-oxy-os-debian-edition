name: Nova Lain Build - Oxys OS (Debootstrap)

on:
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar ferramentas de Build
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin mtools

      - name: Clonar repositório
        uses: actions/checkout@v4

      - name: Construir sistema base com Debootstrap
        run: |
          # Cria a pasta raiz limpa
          sudo mkdir -p /oxys_root
          # Baixa apenas o essencial (sem lixo do GitHub/Container)
          sudo debootstrap --variant=minbase stable /oxys_root http://deb.debian.org/debian

      - name: Preparar chroot e Injetar pacotes
        run: |
          # Prepara o ambiente para rodar dentro da raiz nova
          sudo cp /etc/resolv.conf /oxys_root/etc/resolv.conf
          sudo mount --bind /proc /oxys_root/proc
          sudo mount --bind /sys /oxys_root/sys
          sudo mount --bind /dev /oxys_root/dev
          
          # Copia seus pacotes customizados para dentro do sistema novo
          sudo mkdir -p /oxys_root/tmp/packages
          sudo cp -r oxys-pack/packges-beta/*/*.deb /oxys_root/tmp/packages/
          
          # Instala os pacotes com autoridade (o dpkg respeitará os Replaces/Breaks do seu control)
          sudo chroot /oxys_root /bin/bash -c "dpkg -i /tmp/packages/*.deb"
          
          # Ajusta dependências caso algo tenha faltado
          sudo chroot /oxys_root /bin/bash -c "apt-get install -f -y"

      - name: Limpeza e Finalização do Sistema
        run: |
          # Remove os arquivos temporários dos pacotes
          sudo rm -rf /oxys_root/tmp/packages
          sudo rm -rf /oxys_root/var/lib/apt/lists/*
          
          # Garante que o diretório live exista
          sudo mkdir -p /oxys_root/live

      - name: Gerar SquashFS e ISO
        run: |
          # Estrutura de pastas da ISO
          mkdir -p iso_work/boot/grub
          
          # Compacta a raiz limpa (apenas o que está em /oxys_root)
          sudo mksquashfs /oxys_root iso_work/live/filesystem.squashfs -comp xz
          
          # Copia kernel/initrd do sistema de build (ou você pode copiar do seu pacote oxy-base se tiver o kernel lá)
          sudo cp /boot/vmlinuz-* /iso_work/live/vmlinuz 2>/dev/null || true
          sudo cp /boot/initrd.img-* /iso_work/live/initrd.img 2>/dev/null || true

          # Cria o GRUB config
          cat <<EOF > iso_work/boot/grub/grub.cfg
          menuentry "Oxys OS (Live)" {
              linux /live/vmlinuz boot=live
              initrd /live/initrd.img
          }
          EOF
          
          # Gera a ISO final
          grub-mkrescue -o oxys-os.iso iso_work

      - name: Upload da ISO
        uses: actions/upload-artifact@v4
        with:
          name: oxys-os-iso
          path: oxys-os.iso
