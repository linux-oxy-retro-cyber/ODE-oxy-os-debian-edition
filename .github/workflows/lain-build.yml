name: Lain Build - Full Oxys OS

on:
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin mtools

      - name: Clonar repositório
        uses: actions/checkout@v4

      - name: Criar Raiz
        run: |
          sudo mkdir -p /oxys_root
          sudo debootstrap --variant=minbase stable /oxys_root http://deb.debian.org/debian

      - name: Instalar pacotes
        run: |
          sudo cp /etc/resolv.conf /oxys_root/etc/resolv.conf
          sudo mount --bind /proc /oxys_root/proc
          sudo mount --bind /sys /oxys_root/sys
          sudo mount --bind /dev /oxys_root/dev
          sudo mkdir -p /oxys_root/tmp/packages
          sudo cp -r oxys-pack/packges-beta/*/*.deb /oxys_root/tmp/packages/
          # O apt resolve as dependências automaticamente
          sudo chroot /oxys_root /bin/bash -c "apt-get update && apt-get install -y /tmp/packages/*.deb"

      - name: Aplicar Configuracoes Lain
        run: |
          # Hostname
          echo "oxys-os" | sudo tee /oxys_root/etc/hostname
          echo "127.0.0.1 localhost oxys-os" | sudo tee /oxys_root/etc/hosts
          
          # OS Release[cite: 3]
          sudo tee /oxys_root/etc/os-release <<EOF
          PRETTY_NAME="Oxys OS v2.0 (wired)"
          NAME="Oxys OS (wired)"
          VERSION_ID="2.0"
          VERSION="2.0"
          VERSION_CODENAME=(wired)
          ID=oxys
          ID_LIKE=debian
          HOME_URL="https://github.com/linux-oxy-retro-cyber/ODE-oxy-os-debian-edition"
          SUPPORT_URL="https://github.com/linux-oxy-retro-cyber/ODE-oxy-os-debian-edition"
          BUG_REPORT_URL="https://github.com/linux-oxy-retro-cyber/ODE-oxy-os-debian-edition/pulls"
          EOF
          
          # Grub[cite: 1]
          sudo tee /oxys_root/etc/default/grub <<EOF
          GRUB_DEFAULT=0
          GRUB_TIMEOUT=5
          GRUB_DISTRIBUTOR="Oxys OS  "
          GRUB_CMDLINE_LINUX_DEFAULT="quiet"
          GRUB_CMDLINE_LINUX=""
          EOF
          
          # Zram[cite: 2]
          sudo tee /oxys_root/etc/default/zramswap <<EOF
          ALGORITHM=zstd
          PERCENT=100
          ALLOCATION_MIN_BYTES=67108864
          PRIORITY=32767
          EOF

      - name: Gerar ISO
        run: |
          mkdir -p iso_work/boot/grub
          sudo mksquashfs /oxys_root iso_work/live/filesystem.squashfs -comp xz
          
          # Copia kernel/initrd do chroot (se estiver lá) ou do ambiente de build
          sudo cp /oxys_root/boot/vmlinuz-* iso_work/live/vmlinuz 2>/dev/null || sudo cp /boot/vmlinuz-* iso_work/live/vmlinuz
          sudo cp /oxys_root/boot/initrd.img-* iso_work/live/initrd.img 2>/dev/null || sudo cp /boot/initrd.img-* iso_work/live/initrd.img

          cat <<EOF > iso_work/boot/grub/grub.cfg
          menuentry "Oxys OS (Live)" {
              linux /live/vmlinuz boot=live
              initrd /live/initrd.img
          }
          EOF
          
          grub-mkrescue -o oxys-os.iso iso_work

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: oxys-os-iso
          path: oxys-os.iso
