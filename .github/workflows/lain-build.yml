name: Lain Build - Full Oxys OS

on:
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin mtools git

      - name: Clonar e Criar Raiz
        run: |
          git clone --depth 1 https://github.com/linux-oxy-retro-cyber/ODE-oxy-os-debian-edition.git temp_repo
          # Debootstrap inclui o básico + ferramentas de rede e gerenciamento
          sudo debootstrap --variant=minbase --include=grub-pc,linux-image-amd64,live-boot,live-config,initramfs-tools,systemd-sysv,apt-utils,dialog,locales,lsb-release stable /oxys_root http://deb.debian.org/debian

      - name: Instalar Kit Ante Erros e Pacotes
        run: |
          sudo cp /etc/resolv.conf /oxys_root/etc/resolv.conf
          sudo mount --bind /proc /oxys_root/proc
          sudo mount --bind /sys /oxys_root/sys
          sudo mount --bind /dev /oxys_root/dev
          
          # Copia os 3 pacotes
          sudo mkdir -p /oxys_root/tmp/packages
          sudo cp temp_repo/oxys-pack/packges-beta/calamares-temas/oxy-calamares-settings.deb /oxys_root/tmp/packages/
          sudo cp temp_repo/oxys-pack/packges-beta/prioridade/oxys-base-config.deb /oxys_root/tmp/packages/
          sudo cp temp_repo/oxys-pack/packges-beta/temas/oxys-base.deb /oxys_root/tmp/packages/
          
          # 1. Kit Anti-Erros: corrige dependências e instala base necessária
          # 2. Instala os seus .deb
          # 3. Limpeza
          sudo chroot /oxys_root /bin/bash -c "apt-get update && apt-get install -y --fix-broken --fix-missing && apt-get install -y /tmp/packages/*.deb && apt-get clean && rm -rf /tmp/packages/*"

      - name: Aplicar Configuracoes Lain
        run: |
          echo "oxys-os" | sudo tee /oxys_root/etc/hostname
          
          VER=$(cat /oxys_root/etc/debian_version | cut -d. -f1)
          NOME=$([ "$VER" == "13" ] && echo "Oxys 2.0" || echo "Oxys 1")
          sudo tee /oxys_root/etc/os-release <<EOF
          PRETTY_NAME="$NOME"
          NAME="$NOME"
          VERSION_ID="$VER"
          VERSION="$VER"
          ID=oxys
          EOF
          
          sudo tee /oxys_root/etc/default/grub <<EOF
          GRUB_DEFAULT=0
          GRUB_TIMEOUT=5
          GRUB_DISTRIBUTOR="Oxys OS"
          GRUB_CMDLINE_LINUX_DEFAULT="quiet splash boot=live"
          EOF
          
          echo "boot=live" | sudo tee -a /oxys_root/etc/initramfs-tools/modules
          sudo chroot /oxys_root /bin/bash -c "update-initramfs -u"

      - name: Gerar ISO
        run: |
          mkdir -p iso_work/live
          sudo mksquashfs /oxys_root iso_work/live/filesystem.squashfs -comp xz -e dev proc sys
          
          sudo cp /oxys_root/boot/vmlinuz-* iso_work/live/vmlinuz
          sudo cp /oxys_root/boot/initrd.img-* iso_work/live/initrd.img

          mkdir -p iso_work/boot/grub
          cat <<EOF > iso_work/boot/grub/grub.cfg
          menuentry "Oxys OS (Live)" {
              linux /live/vmlinuz boot=live
              initrd /live/initrd.img
          }
          EOF
          
          grub-mkrescue -o oxys-os.iso iso_work

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: oxys-os-iso
          path: oxys-os.iso
