name: Lain Build - Full Oxys OS (Container)

on:
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    container:
      image: debian:stable
      options: --privileged
    steps:
      - name: Instalar ferramentas
        run: |
          apt-get update
          apt-get install -y git squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin mtools live-boot live-config initramfs-tools wget

      - name: Clonar e Preparar
        run: |
          git clone --depth 1 https://github.com/linux-oxy-retro-cyber/ODE-oxy-os-debian-edition.git temp_repo
          # Prepara a estrutura de trabalho na raiz do container
          mkdir -p /oxys_root
          # Vamos copiar a estrutura atual do container para o nosso alvo
          # Isso é muito mais seguro e rápido que debootstrap
          cp -a /bin /boot /dev /etc /home /lib /lib64 /media /mnt /opt /proc /root /run /sbin /srv /sys /tmp /usr /var /oxys_root/ || true

      - name: Instalar pacotes
        run: |
          # Copia apenas os pacotes que você pediu
          mkdir -p /tmp/packages
          cp temp_repo/oxys-pack/packges-beta/calamares-temas/oxy-calamares-settings.deb /tmp/packages/
          cp temp_repo/oxys-pack/packges-beta/prioridade/oxys-base-config.deb /tmp/packages/
          cp temp_repo/oxys-pack/packges-beta/temas/oxys-base.deb /tmp/packages/
          
          # Instala pacotes no sistema raiz (o container já é o sistema)
          dpkg -i /tmp/packages/*.deb || apt-get install -f -y

      - name: Aplicar Configuracoes Lain
        run: |
          # 1. Hostname
          echo "oxys-os" > /etc/hostname
          echo "127.0.0.1 localhost oxys-os" > /etc/hosts
          
          # 2. Logica OS Release Dinamica
          VER=$(cat /etc/debian_version | cut -d. -f1)
          NOME=$([ "$VER" == "13" ] && echo "Oxys 2.0" || echo "Oxys 1")
          
          tee /etc/os-release <<EOF
          PRETTY_NAME="$NOME"
          NAME="$NOME"
          VERSION_ID="$VER"
          VERSION="$VER"
          ID=oxys
          ID_LIKE=debian
          EOF
          
          # 3. Configurar Grub e Force Boot Live
          tee /etc/default/grub <<EOF
          GRUB_DEFAULT=0
          GRUB_TIMEOUT=5
          GRUB_DISTRIBUTOR="Oxys OS"
          GRUB_CMDLINE_LINUX_DEFAULT="quiet splash boot=live"
          GRUB_CMDLINE_LINUX=""
          EOF
          
          # 4. Forçar boot=live no initramfs
          echo "boot=live" >> /etc/initramfs-tools/modules
          update-initramfs -u

      - name: Gerar ISO
        run: |
          mkdir -p iso_work/boot/grub iso_work/live
          # Mover o sistema configurado para o squashfs
          mksquashfs / iso_work/live/filesystem.squashfs -e iso_work temp_repo tmp dev proc sys run
          
          cp /boot/vmlinuz-* iso_work/live/vmlinuz
          cp /boot/initrd.img-* iso_work/live/initrd.img

          cat <<EOF > iso_work/boot/grub/grub.cfg
          menuentry "Oxys OS (Live)" {
              linux /live/vmlinuz boot=live
              initrd /live/initrd.img
          }
          EOF
          
          grub-mkrescue -o oxys-os.iso iso_work

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: oxys-os-iso
          path: oxys-os.iso
