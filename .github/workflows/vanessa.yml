name: Vanessa - System Auditor

on:
  schedule:
    # Roda exatamente de 1 em 1 hora
    - cron: '0 * * * *'
  # Permite que você rode manualmente na aba Actions quando quiser testar
  workflow_dispatch:

jobs:
  audit-hourly:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Instalar Dependências do Sistema
        run: |
          sudo apt-get update -y
          sudo apt-get install -y curl jq tar

      - name: Coletar Métricas e Gerar Relatório Extenso
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # Configurações de tempo (janela exata da última 1 hora)
          TIMESTAMP_NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          TIMESTAMP_PAST=$(date -u -d '1 hour ago' +"%Y-%m-%dT%H:%M:%SZ")
          TIMESTAMP_FILE=$(date -u +"%Y%m%d_%H%M%S")
          
          REPORT_DIR="vanessa_audit_${TIMESTAMP_FILE}"
          REPORT_FILE="${REPORT_DIR}/relatorio_completo.txt"
          
          mkdir -p "$REPORT_DIR"

          echo "=================================================================" > "$REPORT_FILE"
          echo "         VANESSA SYSTEM AUDITOR - RELATÓRIO HORÁRIO              " >> "$REPORT_FILE"
          echo "=================================================================" >> "$REPORT_FILE"
          echo "REPOSITÓRIO: $REPO" >> "$REPORT_FILE"
          echo "HORÁRIO DA EXECUÇÃO: $TIMESTAMP_NOW" >> "$REPORT_FILE"
          echo "JANELA DE ANÁLISE: $TIMESTAMP_PAST até $TIMESTAMP_NOW" >> "$REPORT_FILE"
          echo "SISTEMA OPERACIONAL: $(lsb_release -ds)" >> "$REPORT_FILE"
          echo "KERNEL: $(uname -r)" >> "$REPORT_FILE"
          echo "=================================================================" >> "$REPORT_FILE"
          echo "" >> "$REPORT_FILE"

          # -----------------------------------------------------------------
          # 1. VISUALIZAÇÕES E TRAFEGO (VIEWS & CLONES)
          # -----------------------------------------------------------------
          echo "--- [1. TRÁFEGO E CLONES] ---" >> "$REPORT_FILE"
          
          VIEWS_JSON=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/traffic/views")
            
          CLONES_JSON=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/traffic/clones")

          TOTAL_VIEWS=$(echo "$VIEWS_JSON" | jq -r '.count // 0')
          UNIQUE_VIEWS=$(echo "$VIEWS_JSON" | jq -r '.uniques // 0')
          TOTAL_CLONES=$(echo "$CLONES_JSON" | jq -r '.count // 0')
          UNIQUE_CLONES=$(echo "$CLONES_JSON" | jq -r '.uniques // 0')

          echo "Visualizações Totais (acumulado 14d): $TOTAL_VIEWS" >> "$REPORT_FILE"
          echo "Visitantes Únicos (acumulado 14d): $UNIQUE_VIEWS" >> "$REPORT_FILE"
          echo "Clones Totais (acumulado 14d): $TOTAL_CLONES" >> "$REPORT_FILE"
          echo "Clonares Únicos (acumulado 14d): $UNIQUE_CLONES" >> "$REPORT_FILE"
          echo "" >> "$REPORT_FILE"

          # Histórico detalhado por hora/dia das views
          echo "Detalhamento de Views por Timestamp:" >> "$REPORT_FILE"
          echo "$VIEWS_JSON" | jq -r '.views[]? | "  - Data: \(.timestamp) | Views: \(.count) | Únicos: \(.uniques)"' >> "$REPORT_FILE"
          echo "" >> "$REPORT_FILE"

          # -----------------------------------------------------------------
          # 2. PULL REQUESTS
          # -----------------------------------------------------------------
          echo "--- [2. PULL REQUESTS MODIFICADOS/ABERTOS] ---" >> "$REPORT_FILE"
          
          PRS_JSON=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/pulls?state=all&sort=updated&direction=desc")

          echo "$PRS_JSON" | jq -c '.[]' | while read -r pr; do
            PR_UPDATED=$(echo "$pr" | jq -r '.updated_at')
            if [[ "$PR_UPDATED" > "$TIMESTAMP_PAST" ]]; then
              PR_NUM=$(echo "$pr" | jq -r '.number')
              PR_TITLE=$(echo "$pr" | jq -r '.title')
              PR_STATE=$(echo "$pr" | jq -r '.state')
              PR_USER=$(echo "$pr" | jq -r '.user.login')
              PR_DRAFT=$(echo "$pr" | jq -r '.draft')
              echo "  [PR #$PR_NUM] - $PR_TITLE" >> "$REPORT_FILE"
              echo "    Autor: $PR_USER | Status: $PR_STATE | Draft: $PR_DRAFT" >> "$REPORT_FILE"
              echo "    Atualizado em: $PR_UPDATED" >> "$REPORT_FILE"
              echo "    -------------------------------------------------" >> "$REPORT_FILE"
            fi
          done
          echo "" >> "$REPORT_FILE"

          # -----------------------------------------------------------------
          # 3. COMMITS E MUDANÇAS NO CÓDIGO
          # -----------------------------------------------------------------
          echo "--- [3. COMMITS REALIZADOS NA ÚLTIMA HORA] ---" >> "$REPORT_FILE"
          
          COMMITS_JSON=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/commits?since=$TIMESTAMP_PAST")

          echo "$COMMITS_JSON" | jq -c '.[]?' | while read -r commit; do
            SHA=$(echo "$commit" | jq -r '.sha' | cut -c1-7)
            AUTHOR=$(echo "$commit" | jq -r '.commit.author.name')
            MSG=$(echo "$commit" | jq -r '.commit.message' | head -n 1)
            DATE=$(echo "$commit" | jq -r '.commit.author.date')
            echo "  Commit: [$SHA] por $AUTHOR ($DATE)" >> "$REPORT_FILE"
            echo "  Mensagem: $MSG" >> "$REPORT_FILE"
            echo "  -------------------------------------------------" >> "$REPORT_FILE"
          done
          echo "" >> "$REPORT_FILE"

          # -----------------------------------------------------------------
          # 4. RELEASES E TAGS
          # -----------------------------------------------------------------
          echo "--- [4. RELEASES DA ÚLTIMA HORA] ---" >> "$REPORT_FILE"
          
          RELEASES_JSON=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/releases")

          echo "$RELEASES_JSON" | jq -c '.[]?' | while read -r rel; do
            REL_DATE=$(echo "$rel" | jq -r '.created_at')
            if [[ "$REL_DATE" > "$TIMESTAMP_PAST" ]]; then
              REL_NAME=$(echo "$rel" | jq -r '.name // .tag_name')
              REL_TAG=$(echo "$rel" | jq -r '.tag_name')
              REL_AUTHOR=$(echo "$rel" | jq -r '.author.login')
              REL_DRAFT=$(echo "$rel" | jq -r '.draft')
              REL_PRE=$(echo "$rel" | jq -r '.prerelease')
              echo "  Release: $REL_NAME (Tag: $REL_TAG)" >> "$REPORT_FILE"
              echo "  Criador: $REL_AUTHOR | Draft: $REL_DRAFT | Pre-release: $REL_PRE" >> "$REPORT_FILE"
              echo "  Publicado em: $REL_DATE" >> "$REPORT_FILE"
              echo "  -------------------------------------------------" >> "$REPORT_FILE"
            fi
          done
          echo "" >> "$REPORT_FILE"

          # -----------------------------------------------------------------
          # 5. ISSUES E EVENTOS GERAIS
          # -----------------------------------------------------------------
          echo "--- [5. ISSUES ATUALIZADAS] ---" >> "$REPORT_FILE"
          
          ISSUES_JSON=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/issues?state=all&since=$TIMESTAMP_PAST")

          echo "$ISSUES_JSON" | jq -c '.[]?' | while read -r issue; do
            # Filtra para não duplicar Pull Requests (já que a API do Github trata PR como Issue)
            IS_PR=$(echo "$issue" | jq -r '.pull_request // empty')
            if [ -z "$IS_PR" ]; then
              ISSUE_NUM=$(echo "$issue" | jq -r '.number')
              ISSUE_TITLE=$(echo "$issue" | jq -r '.title')
              ISSUE_STATE=$(echo "$issue" | jq -r '.state')
              ISSUE_USER=$(echo "$issue" | jq -r '.user.login')
              echo "  Issue #$ISSUE_NUM: $ISSUE_TITLE" >> "$REPORT_FILE"
              echo "  Autor: $ISSUE_USER | Status: $ISSUE_STATE" >> "$REPORT_FILE"
              echo "  -------------------------------------------------" >> "$REPORT_FILE"
            fi
          done
          echo "" >> "$REPORT_FILE"

          # Dump bruto de segurança (salva respostas em JSON puro dentro da pasta para auditoria profunda)
          echo "$VIEWS_JSON" > "${REPORT_DIR}/raw_views.json"
          echo "$CLONES_JSON" > "${REPORT_DIR}/raw_clones.json"
          echo "$PRS_JSON" > "${REPORT_DIR}/raw_pull_requests.json"
          echo "$COMMITS_JSON" > "${REPORT_DIR}/raw_commits.json"
          echo "$RELEASES_JSON" > "${REPORT_DIR}/raw_releases.json"

          # Salva o nome da pasta para a próxima step saber onde procurar
          echo "REPORT_DIR=${REPORT_DIR}" >> $GITHUB_ENV

      - name: Disponibilizar Artefato no GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: vanessa-relatorio-${{ env.REPORT_DIR }}
          path: ${{ env.REPORT_DIR }}/
          if-no-files-found: error
